# Sveltia CMS Configuration for Portfolio Project

backend:
  name: github
  repo: AetherFineArt/astro-photography-portfolio # Placeholder
  branch: main
  base_url: https://astro-portfolio.pages.dev # Placeholder
  auth_endpoint: api/auth

# Media Folders
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow

collections:
  - name: "photos"
    label: "Photographs"
    label_singular: "Photograph"
    folder: "src/content/photos"
    create: true
    slug: "{{slug}}"
    format: "yaml-frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Landscape", value: "landscape" }
          - { label: "Portrait", value: "portrait" }
          - { label: "Editorial & Fashion", value: "editorial" }
          - { label: "Street & Urban", value: "street" }
        required: true
      - { label: "Upload Image", name: "image", widget: "image", required: true }
      - { label: "Date Taken", name: "date_taken", widget: "date", required: true }
      - { label: "Camera & Lens (EXIF)", name: "equipment", widget: "string", placeholder: "e.g. Sony A7R V, 85mm f/1.4 GM", required: false }
      - label: "Story Behind the Shot"
        name: "body"
        widget: "markdown"
        required: false
        buttons: ["bold", "italic", "code", "link", "heading-three", "quote", "bulleted-list", "numbered-list"]

  - name: "about_page"
    label: "About & Info"
    delete: false
    files:
      - name: "about"
        label: "About Me & Contact"
        file: "src/content/about/about-me.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string", default: "Behind the Lens" }
          - { label: "Profile Picture", name: "profile_image", widget: "image" }
          - { label: "Email Contact", name: "email", widget: "string", required: true }
          - { label: "WhatsApp Contact Number", name: "whatsapp", widget: "string", placeholder: "e.g. +44 7700 900111", required: false }
          - label: "Detailed Biography"
            name: "body"
            widget: "markdown"
            required: true
            buttons: ["bold", "italic", "link", "quote"]
